name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Run unit tests
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Build the dashboard container image
        run: docker build --target web --build-arg VITE_API_URL=http://localhost:4000 -t devmesh-web-ci .
