services:
  postgres:
    image: postgres:16-alpine
    container_name: devmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devmesh
      POSTGRES_PASSWORD: devmesh_local_password
      POSTGRES_DB: devmesh
    ports:
      - "5433:5432"
    volumes:
      - devmesh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmesh -d devmesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devmesh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - devmesh_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: api
    command: ["npm", "run", "db:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://devmesh:devmesh_local_password@postgres:5432/devmesh?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]
    restart: "no"

  seed:
    build:
      context: .
      target: api
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgresql://devmesh:devmesh_local_password@postgres:5432/devmesh?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]
    restart: "no"

  api:
    build:
      context: .
      target: api
    container_name: devmesh-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://devmesh:devmesh_local_password@postgres:5432/devmesh?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:4173
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-devmesh-local-auth-secret-change-before-production-32}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    profiles: ["app"]

  worker:
    build:
      context: .
      target: worker
    container_name: devmesh-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://devmesh:devmesh_local_password@postgres:5432/devmesh?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    profiles: ["app"]

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: devmesh-web
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["app"]

volumes:
  devmesh_pgdata:
  devmesh_redisdata:
