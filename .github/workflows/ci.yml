name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Run unit tests
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Build the dashboard container image
        run: docker build --target web --build-arg VITE_API_URL=http://localhost:4000 -t devmesh-web-ci .

  integration:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devmesh
          POSTGRES_PASSWORD: devmesh_local_password
          POSTGRES_DB: devmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmesh -d devmesh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devmesh:devmesh_local_password@localhost:5432/devmesh?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_TOKEN_SECRET: integration-test-secret-with-at-least-32-bytes
      API_PORT: 4000
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed the integration database
        run: npm run db:seed

      - name: Start API and run integration checks
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/src/index.js > /tmp/devmesh-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/devmesh-api.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat /tmp/devmesh-api.log
            exit 1
          fi

          node apps/api/test/integration-smoke.js
