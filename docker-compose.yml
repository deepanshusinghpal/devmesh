services:
  postgres:
    image: postgres:16-alpine
    container_name: devmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devmesh
      POSTGRES_PASSWORD: devmesh_local_password
      POSTGRES_DB: devmesh
    ports:
      - "5433:5432"
    volumes:
      - devmesh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmesh -d devmesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devmesh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - devmesh_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devmesh_pgdata:
  devmesh_redisdata:
